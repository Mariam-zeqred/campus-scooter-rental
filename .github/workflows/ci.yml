name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4   # the CDK library runs on Node
        with:
          node-version: 22
      - run: pip install -r cloud/requirements-dev.txt
      - run: python tools/check.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Host tests (Unity)
        run: cd firmware && pio test -e native
      - name: Build for ESP32
        run: cd firmware && pio run -e esp32dev
