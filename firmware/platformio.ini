; PlatformIO project for the scooter controller.
;   pio run -e esp32dev        build the firmware
;   pio test -e native         run the hardware-free tests on this computer
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; BLE + Wi-Fi + TLS do not fit the default 1.2 MB app slot.
board_build.partitions = min_spiffs.csv
build_flags = -I include
lib_deps =
    adafruit/Adafruit ADXL345@^1.3.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    256dpi/MQTT@^2.5.2

[env:native]
platform = native
test_framework = unity
build_flags = -I include -std=c++17
